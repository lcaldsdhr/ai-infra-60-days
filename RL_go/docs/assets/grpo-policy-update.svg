<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 的优势怎样改变策略概率</title>
  <desc id="desc">展示初始均匀策略在正负组相对优势的梯度更新后，正优势轨迹的概率上升、负优势轨迹的概率下降。</desc>
  <defs><style>.bg{fill:#fbf7ef}.paper{fill:#fffdf8}.ink{stroke:#102f61;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#102f61;stroke-width:2.5;fill:none;stroke-linecap:round}.teal{fill:#64bdb5}.blue{fill:#b8cde2}.coral{fill:#ef7f64}.gold{fill:#f4dc88}text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#102f61}.h{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#557093}.label{font-size:22px;font-weight:700;text-anchor:middle}.small{font-size:17px;text-anchor:middle;fill:#557093}.value{font-size:22px;font-weight:700;text-anchor:middle}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102f61"/></marker></defs>
  <rect class="bg" width="1400" height="650" rx="28"/><text class="h" x="60" y="66">正优势不是“挑出最好答案”，而是让它更可能再次出现</text><text class="sub" x="60" y="96">最小示例：只做一次 gradient-ascent，初始四条轨迹的 logits 全为 0。</text>
  <rect class="paper ink" x="60" y="145" width="360" height="370" rx="22"/><text class="label" x="240" y="192">更新前：均匀策略</text><text class="small" x="240" y="222">softmax([0, 0, 0, 0])</text>
  <rect class="blue" x="105" y="292" width="48" height="120" rx="6"/><rect class="blue" x="180" y="292" width="48" height="120" rx="6"/><rect class="blue" x="255" y="292" width="48" height="120" rx="6"/><rect class="blue" x="330" y="292" width="48" height="120" rx="6"/>
  <text class="value" x="129" y="447">0.25</text><text class="value" x="204" y="447">0.25</text><text class="value" x="279" y="447">0.25</text><text class="value" x="354" y="447">0.25</text><text class="small" x="129" y="481">轨迹 1</text><text class="small" x="204" y="481">轨迹 2</text><text class="small" x="279" y="481">轨迹 3</text><text class="small" x="354" y="481">轨迹 4</text>
  <path class="ink" d="M455 330H625" marker-end="url(#arrow)"/><text class="label" x="540" y="282">最大化 mean(A · log π)</text><text class="small" x="540" y="314">学习率 = 0.5；优势和为 0</text>
  <rect class="paper ink" x="660" y="145" width="280" height="370" rx="22"/><text class="label" x="800" y="192">优势给出方向</text><rect class="coral" x="704" y="242" width="190" height="42" rx="10"/><text class="label" x="799" y="270">A₁ = −0.866</text><rect class="teal" x="704" y="307" width="190" height="42" rx="10"/><text class="label" x="799" y="335">A₂ = +0.866</text><rect class="teal" x="704" y="372" width="190" height="42" rx="10"/><text class="label" x="799" y="400">A₃ = +0.866</text><rect class="coral" x="704" y="437" width="190" height="42" rx="10"/><text class="label" x="799" y="465">A₄ = −0.866</text>
  <path class="ink" d="M970 330H1040" marker-end="url(#arrow)"/>
  <rect class="paper ink" x="1075" y="145" width="270" height="370" rx="22"/><text class="label" x="1210" y="192">更新后：偏向高分轨迹</text><rect class="coral" x="1107" y="305" width="38" height="107" rx="6"/><rect class="teal" x="1162" y="279" width="38" height="133" rx="6"/><rect class="teal" x="1217" y="279" width="38" height="133" rx="6"/><rect class="coral" x="1272" y="305" width="38" height="107" rx="6"/><text class="value" x="1126" y="447">.223</text><text class="value" x="1181" y="447">.277</text><text class="value" x="1236" y="447">.277</text><text class="value" x="1291" y="447">.223</text><text class="small" x="1126" y="481">低 A</text><text class="small" x="1181" y="481">高 A</text><text class="small" x="1236" y="481">高 A</text><text class="small" x="1291" y="481">低 A</text>
  <rect class="paper thin" x="60" y="553" width="1285" height="48" rx="15"/><text x="83" y="584" style="font-size:18px;font-weight:700">记忆点：</text><text x="170" y="584" style="font-size:18px">优势是“概率该往哪边动”的学习信号；clip、KL、多个 epoch 则负责让这次移动不要太猛。</text>
</svg>
